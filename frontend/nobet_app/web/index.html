<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!-- viewport-fit=cover: Flutter içeriğinin çentik/durum çubuğu alanının
       altına kadar uzanmasını sağlar (black-translucent durum çubuğu ile
       birlikte kullanılır). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- Tarayıcı arayüzü rengi; uygulama içi Açık/Koyu mod geçişini Flutter tarafı
       (SystemChrome) çalışma zamanında günceller. -->
  <meta name="theme-color" content="#121212">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black-translucent": durum çubuğu şeffaf olur ve altındaki Flutter
       içeriğinin (AppTheme'in o an ki rengi) görünmesini sağlar — böylece
       Açık modda beyaz, Koyu modda siyah olarak uygulama temasını izler. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="nobet_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nöbet Sistemi</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { background-color: #121212; height: 100%; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
